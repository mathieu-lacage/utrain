[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shakespeare-char"
version = "1.0.0"
description = "Character-level Shakespeare LLM, packaged as a utrain container"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "pyyaml>=6.0",
    "wandb>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
]

[project.scripts]
shakespeare-char = "shakespeare_char.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/shakespeare_char"]
