repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.t$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        name: Spell check source files
        exclude: frontend/package-lock.json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-from-imports
        name: Ban from-imports for everything except relative imports
        entry: scripts/check-imports
        language: system
        types: [python]
      - id: pyright
        name: Type checking for python
        entry: uv run --frozen pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: coverage
        name: Test coverage (≥80%)
        entry: env COVERAGE_PROCESS_START=pyproject.toml uv run pytest --cov=utrain --cov-fail-under=50
        language: system
        pass_filenames: false
      - id: vue-tsc
        name: TypeScript type check (frontend)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/src/.*\.(ts|vue)$
        pass_filenames: false
      - id: eslint-frontend
        name: ESLint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|vue)$
        pass_filenames: false
      - id: licensecheck
        name: License compatibility
        entry: uv run --frozen licensecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: uv-audit
        name: Vulnerability scan (uv audit)
        entry: uv audit
        language: system
        pass_filenames: false
        stages: [pre-push]
