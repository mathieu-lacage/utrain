repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: (\.t|\.cast)$
      - id: end-of-file-fixer
        exclude: ^docs/assets/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        # The TUI tour. A cast is a full-screen repaint several times a second,
        # so it is megabytes on disk -- and gzips to about fifty kilobytes,
        # which is what git actually stores per revision. The hook measures the
        # wrong number for this one file.
        exclude: ^docs/assets/.*\.cast$
      - id: debug-statements
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        name: Spell check source files
        # docs/assets: a minified JS bundle, the Apache licence text and a
        # terminal recording, none of them prose anyone wrote.
        exclude: ^(frontend/package-lock\.json|docs/assets/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-from-imports
        name: Ban from-imports for everything except relative imports
        entry: scripts/check-imports
        language: system
        types: [python]
      - id: pyright
        name: Type checking for python
        # --group containers: pyright also checks containers/shakespeare-char,
        # which imports torch and wandb. They live in their own group so the
        # test and docs jobs, which do not type check, never download torch.
        entry: uv run --frozen --group containers pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: licensecheck
        name: License compatibility
        entry: uv run --frozen licensecheck
        language: system
        pass_filenames: false
      - id: uv-audit
        name: Vulnerability scan (uv audit)
        entry: uv audit
        language: system
        pass_filenames: false
      - id: check-changelog-fragments
        name: Check changes/ fragments match a configured towncrier type
        entry: scripts/check-changelog-fragments
        language: system
        files: ^changes/
        pass_filenames: false
