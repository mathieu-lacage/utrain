# CI pipeline.
#
# check stage:   run the pre-commit hooks (`make check`) and the pytest suite on
#                every push to main.
# release stage: on tag pipelines, build every container preset under
#                containers/<name>/ and push it to this project's GitLab
#                container registry. The pre-commit hooks also run on tags (the
#                check stage runs first), so a release only publishes if they pass.
#
# Users pull a published preset with:
#   utrain image add docker://$CI_REGISTRY_IMAGE/<name>:latest
#
# Prerequisites:
#   - Container Registry enabled (Settings -> General -> Visibility).

stages: [check, release, deploy]

pre-commit:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.11-bookworm
  tags:
    - linux
  variables:
    PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  cache:
    key: pre-commit
    paths:
      - .cache/pre-commit
      - .cache/uv
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - uv run --frozen pre-commit run --all-files --show-diff-on-failure

test:
  stage: check
  # Every cram test builds and runs a container, so the suite needs podman. The
  # job container itself cannot provide it: podman needs a user namespace, and
  # the shared runners deny CLONE_NEWUSER inside a job ("cannot clone: Operation
  # not permitted"). No combination of added capabilities gets there -- only
  # full privilege does.
  #
  # So don't run podman in the job. The shared runners expose the VM's docker
  # socket and allow privileged containers, so the job starts a *privileged
  # sibling* through that socket and runs the whole suite inside it. pytest and
  # podman then live in the same container, which is what makes the bind mounts
  # in orchestrator.py work: they resolve in a single filesystem view, with no
  # host/container path translation anywhere.
  #
  # $CI_PROJECT_DIR is mountable because it sits under /builds, which the runner
  # docs name (with /tmp) as the only paths shared between the job container and
  # the VM the docker engine runs on. A checkout anywhere else would mount empty.
  image: docker:stable
  tags:
    - linux
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
  cache:
    key: test
    paths:
      - .cache/uv
  script:
    # vfs because the sibling's container storage is itself inside a container,
    # where overlay needs a host mount it does not have. It is space-hungry --
    # if this job starts failing on disk, move to the `large_more_disk` runner.
    #
    # The busybox run is a guard, not a warm-up: conftest turns a failed image
    # build into pytest.skip, so a podman that cannot nest would otherwise show
    # up as a green pipeline that silently tested nothing. Fail loudly instead.
    #
    # -rs prints every skip reason, so a suite that goes quiet in CI says why in
    # the job log rather than just shrinking.
    - |
      docker run --rm --privileged \
        -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR" -w "$CI_PROJECT_DIR" \
        -e STORAGE_DRIVER=vfs -e UV_CACHE_DIR="$CI_PROJECT_DIR/.cache/uv" \
        quay.io/podman/stable sh -c '
          set -e
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          podman run --rm docker.io/library/busybox:latest true
          uv run --frozen pytest -rs
        '

build-images:
  stage: release
  image:
    # The :debug tag ships /busybox/sh so the shell loop below can run.
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  tags:
    - linux
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"$CI_REGISTRY":{"username":"$CI_REGISTRY_USER","password":"$CI_REGISTRY_PASSWORD"}}}
      EOF
    - |
      for dir in containers/*/; do
        name=$(basename "$dir")
        [ -f "containers/$name/Containerfile" ] || continue
        echo "Building and pushing $name"
        /kaniko/executor \
          --context "$CI_PROJECT_DIR" \
          --dockerfile "containers/$name/Containerfile" \
          --destination "$CI_REGISTRY_IMAGE/$name:$CI_COMMIT_TAG" \
          --destination "$CI_REGISTRY_IMAGE/$name:latest"
      done

pages:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  stage: deploy
  tags:
    - linux
  needs:
    - job: pre-commit
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
    GIT_DEPTH: "0"
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  before_script:
    - uv sync --frozen
    - git remote set-url origin "https://oauth2:${MIKE_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        uv run mike deploy --push --update-aliases "$CI_COMMIT_TAG" latest
        uv run mike set-default --push latest
      else
        uv run mike deploy --push --update-aliases dev
        # mike only creates the "/" redirect once "set-default" has been
        # run at least once. Bootstrap it to "dev" so the site is reachable
        # at "/" before the first release tag exists; once a tag has set
        # the default to "latest", leave it alone on later dev pushes.
        if ! git cat-file -e pages:index.html 2>/dev/null; then
          uv run mike set-default --push dev
        fi
      fi
    - rm -rf public && mkdir public
    - git archive pages | tar -x -C public
  artifacts:
    paths:
      - public
