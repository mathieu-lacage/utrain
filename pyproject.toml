[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utrain"
version = "0.0.7"
description = "Local web UI for end-to-end LLM training"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "INRIA", email = "mathieu.lacage@inria.fr" }]
keywords = ["llm", "training", "fine-tuning", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    # 0.0.9 is where `naw.wandb.init` learned to read WANDB_DIR, which is how
    # the orchestrator tells a phase where to log (orchestrator._wandb_mount_args).
    # An older naw silently writes to the container's working directory instead.
    "naw>=0.0.9",
]

[project.optional-dependencies]
# The TUI only. Kept out of the base install because `utrain` is useful without
# it and these pull numpy in transitively; `utrain tui` raises a UI error
# pointing here when they are missing, the way naw does for its own plotting.
tui = [
    "textual>=0.80",
    "uniplot[rich]>=0.23.2",
    # Only for exporting a plot: uniplot draws the dashboard, and matplotlib is
    # what turns one of its curves into a png, an svg or a pdf. In this extra
    # rather than one of its own because it pulls nothing uniplot has not
    # already pulled -- numpy -- and an export key that is dark unless you
    # guessed at a second extra is worse than a slightly larger install.
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://mlacage.gitlabpages.inria.fr/utrain"
Documentation = "https://mlacage.gitlabpages.inria.fr/utrain"
Repository = "https://gitlab.inria.fr/mlacage/utrain"
Changelog = "https://mlacage.gitlabpages.inria.fr/utrain/latest/changelog"

[project.scripts]
utrain = "utrain.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test shells out to cram, which shells out to podman, so the suite is
# almost entirely subprocess wait time and parallelizes well. Override with
# `-n0` to debug.
#
# `-n auto` is one worker per *physical* core, ignoring hyperthreading: xdist
# resolves auto via psutil.cpu_count(logical=False), which is why psutil is a
# dev dependency even though nothing imports it. Drop psutil and auto silently
# degrades to sched_getaffinity, i.e. the logical count.
#
# `worksteal` because durations are very uneven -- compute.t is instant,
# run-config-protocol.t is a minute, and that one test is the critical path that
# sets the floor on wall time.
addopts = "--tb=short -n auto --dist worksteal"

[tool.pyright]
# The reference container is a project of its own (its own pyproject.toml, its
# own deps) but is checked with the same settings as the orchestrator. Its
# imports come from the `containers` dependency group below.
#
# `scripts` is here for tour.py, which drives the TUI through a pty and has
# every reason to be held to the same bar as the code it records.
include = ["src", "containers/shakespeare-char/src", "scripts"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["utrain"]
parallel = true
branch = true
relative_files = true
omit = [
    "*/test_*.py",
    "*/bench_*.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "cov"

[tool.towncrier]
# scripts/release.sh runs `towncrier build --version $VERSION` after bumping the
# version, then copies the result into docs/, so the changelog lives at the repo
# root and fragments accumulate in changes/.
package = "utrain"
package_dir = "src"
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://gitlab.inria.fr/mlacage/utrain/-/issues/{issue})"
underlines = ["", "", ""]
start_string = "<!-- towncrier release notes start -->\n"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[tool.tox]
requires = ["tox-uv>=1.13"]
env_list = ["py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
description = "Run the test suite under {base_python}"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
commands = [["pytest", "-rs"]]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }
# Editable so the type checker and the installed copy never disagree; the
# container image does not use this path, it pip-installs the directory itself.
shakespeare-char = { path = "containers/shakespeare-char", editable = true }


[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "cram>=0.7",
    "httpx>=0.27",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    # psutil is not used directly: pytest-xdist needs it for `-n auto` to mean
    # physical cores. Without it xdist falls back to sched_getaffinity, i.e. the
    # hyperthreaded logical count. See the addopts comment above.
    "psutil>=5.9",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.18",
    # Restated from the `tui` extra rather than pulled in as one: uv has no
    # default-extras, and the dev env needs all three regardless -- the TUI
    # tests import textual, the export tests import matplotlib, and the
    # building-a-container cram test shells out to `naw plot`, which needs
    # uniplot.
    "textual>=0.80",
    "uniplot[rich]>=0.23.2",
    "matplotlib>=3.8",
    "towncrier>=24.8",
    "licensecheck>=2025.1.0",
    "uv-audit>=0.1.9",
    "zensical>=0.0.55",
    "mike",
    "tox>=4.21",
    "tox-uv>=1.13",
]
# The reference container, so that pyright can resolve what it imports. It
# declares its own dependencies (torch, wandb) in its own pyproject.toml; they
# arrive here transitively and are pinned in this project's uv.lock.
#
# Deliberately its own group rather than part of `dev`: nothing in utrain
# imports any of it and torch is multi-GB, so no test or docs job should pay for
# it. Installed by the pyright hook in .pre-commit-config.yaml, and nothing else.
containers = [
    "shakespeare-char",
]
