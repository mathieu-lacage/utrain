[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utrain"
version = "0.0.5"
description = "Local web UI for end-to-end LLM training"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "INRIA", email = "mathieu.lacage@inria.fr" }]
keywords = ["llm", "training", "fine-tuning", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "naw>=0.0.4",
]

[project.urls]
Homepage = "https://mlacage.gitlabpages.inria.fr/utrain"
Documentation = "https://mlacage.gitlabpages.inria.fr/utrain"
Repository = "https://gitlab.inria.fr/mlacage/utrain"
Changelog = "https://gitlab.inria.fr/mlacage/utrain/-/raw/main/CHANGELOG.md?ref_type=heads"

[project.scripts]
utrain = "utrain.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test shells out to cram, which shells out to podman, so the suite is
# almost entirely subprocess wait time and parallelizes well. Override with
# `-n0` to debug.
#
# `-n auto` is one worker per *physical* core, ignoring hyperthreading: xdist
# resolves auto via psutil.cpu_count(logical=False), which is why psutil is a
# dev dependency even though nothing imports it. Drop psutil and auto silently
# degrades to sched_getaffinity, i.e. the logical count.
#
# `worksteal` because durations are very uneven -- compute.t is instant,
# run-config-protocol.t is a minute, and that one test is the critical path that
# sets the floor on wall time.
addopts = "--tb=short -n auto --dist worksteal"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["utrain"]
parallel = true
branch = true
relative_files = true
omit = [
    "*/test_*.py",
    "*/bench_*.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "cov"

[tool.towncrier]
# scripts/release.sh runs `towncrier build --version $VERSION` after bumping the
# version, then copies the result into docs/, so the changelog lives at the repo
# root and fragments accumulate in changes/.
package = "utrain"
package_dir = "src"
directory = "changes"
filename = "CHANGELOG.md"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://gitlab.inria.fr/mlacage/utrain/-/issues/{issue})"
underlines = ["", "", ""]
start_string = "<!-- towncrier release notes start -->\n"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = false

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }


[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "cram>=0.7",
    "httpx>=0.27",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    # psutil is not used directly: pytest-xdist needs it for `-n auto` to mean
    # physical cores. Without it xdist falls back to sched_getaffinity, i.e. the
    # hyperthreaded logical count. See the addopts comment above.
    "psutil>=5.9",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.18",
    "towncrier>=24.8",
    "licensecheck>=2025.1.0",
    "uv-audit>=0.1.9",
    "zensical>=0.0.55",
    "mike",
    "uniplot>=0.23.2",
]
