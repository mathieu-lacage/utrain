[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utrain"
version = "0.1.0"
description = "Local web UI for end-to-end LLM training"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "anyio>=4.0",
    "naw>=0.0.4",
]

[project.scripts]
utrain = "utrain.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportMissingTypeStubs = "none"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["utrain"]
parallel = true

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "cram>=0.7",
    "httpx>=0.27",
    "pre-commit>=4.6.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]
